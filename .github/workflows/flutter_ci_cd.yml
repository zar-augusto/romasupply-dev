name: RomaSupply Mobile CI/CD Pipeline
on:
  push: 
    branches: [ main, develop ]
  pull_request: 
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: 
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true
      - run: flutter pub get
        working-directory: ./romasupply
      - run: flutter analyze
        working-directory: ./romasupply
      # - run: flutter test --coverage # Descomentar cuando haya tests
      
  build_android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - run: flutter build apk --release --split-per-abi
        working-directory: ./romasupply
      - run: flutter build appbundle --release
        working-directory: ./romasupply
      - uses: actions/upload-artifact@v4
        with: 
          name: romasupply-android-builds
          path: 'romasupply/build/app/outputs/**/*.aab'
